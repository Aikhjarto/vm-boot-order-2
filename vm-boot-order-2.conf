# Config for vm-boot-order-2.py, installed as /etc/vm-boot-order-2.conf

[settings]
# libvirt connection
#uri = qemu:///system

# After starting a VM, wait until the disk utilization (iostat %util) of this
# device drops below util_limit before starting the next one, but at least
# min_wait and at most the VM's wait time from [start_order].
# Use the iostat -N name, e.g. nvme0n1 or system-root for LVM volumes.
# Leave empty to always wait the full time.
disk = nvme0n1
#util_limit = 80
#min_wait = 5
#iostat_interval = 5

# Wait time for VMs in [start_order] that have none
#default_wait = 0

# Seconds before a VM that ignores the shutdown request is destroyed
#shutdown_timeout = 180
# Seconds between repeated shutdown requests (ACPI) to the same VM
#shutdown_retry_interval = 30
#max_parallel_shutdowns = 5

# VMs that are shut down only after all other VMs have stopped, e.g. a syslog
# server that should receive the shutdown logs of the others. Separate names
# with spaces or commas; they are shut down in parallel in this order.
#shutdown_last = Debian_syslog
#
# TimeoutStopSec= in vm-boot-order-2.service must be larger than
#   (ceil(other VMs / max_parallel_shutdowns)
#    + ceil(shutdown_last VMs / max_parallel_shutdowns)) * shutdown_timeout


# VMs to start, in this order. The value is the maximum number of seconds to
# wait before starting the next VM.
[start_order]
Debian_syslog = 90
Debian_pihole = 90
HAOS = 90
Leap_build


# Order for shutting down. Without this section, the VMs are stopped in
# reverse start order. Up to max_parallel_shutdowns VMs are shut down at the
# same time, so the last ones in this list may still overlap.
#[stop_order]
#Leap_build
#HAOS
#Debian_pihole
#Debian_syslog
